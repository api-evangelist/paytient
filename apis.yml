aid: paytient
name: Paytient
description: >-
  Paytient operates a healthcare payments platform built around the Health Payment
  Account (HPA) — an interest-free, no-credit-check payment card that lets members
  pay for medical, dental, vision, pharmacy, and veterinary care and then repay on a
  self-selected schedule. It is distributed through employers, health plans, insurers,
  brokers, and providers to reduce out-of-pocket cost friction, and provides employer
  dashboards for tracking healthcare spend. Paytient is SOC 2 Type II audited and
  holds NMLS licensure (ID 2040265). The company was surfaced as a portfolio company
  of Felicis and added to the API Evangelist network; as of this pass it publishes no
  public developer API, SDKs, OpenAPI, or documentation surface — only a member/employer
  application and marketing site.
